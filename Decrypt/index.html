<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="lib/crypto-js.min.4.2.0.js"></script>
	<title>Decrypt</title>
	
	<style>
		body {
			display: flex;
			flex-direction: column;
			align-index: center;
			justify-content: center;
			min-height: 100vh;
			margin: 0;
			padding: 20px;
			box-sizing: border-box;
			font-family: sans-serif;
			background-color: #f9f9f9;
		}

		table {
			width: 100%;
			max-width: 400px;
		}

		td {
			display: block;
			width: 100%;
			padding: 5px 0;
			font-size: 16px;
		}

		input[type='text'], 
		input[type='password'] {
			width: 100%;
			padding: 12px;
			font-size: 16px;
			box-sizing: border-box;
			border: 1px solid #ccc;
			border-radius: 4px;
			margin-bottom: 10px;
		}

		input[type='button'] {
			width: 48%;
			padding: 12px;
			font-size: 16px;
			cursor: pointer;
			border-radius: 4px;
			border: 1px solid #999;
			background-color: #eee;
		}

		.buttons-row {
			display: flex;
			justify-content: space-between;
		}
	</style>
</head>

<body>
	<table>
		<tr>
			<td>Shared Secret:</td>
			<td><input type='password' name='sharedSecret' id='sharedSecret'></td>
		</tr>
		<tr>
			<td>Encrypted password:</td>
			<td><input type='text' name='password' id='password'></td>
		</tr>
		<tr>
			<td colspan="2" class="buttons-row">
				<input type="button" value="Decrypt" name="decrypt" id="decrypt" onclick="tryDecryptPwd()"/>
				<input type="button" value="Copy" name="copy" id="copy" onclick="copyPassword()"/>
			</td>
		</tr>
	</table>
	<p id='errorMsg' style="color: red; text-align: center;"></p>
	<p id='result' style="text-align: center; font-weight: bold;"></p>
</body>
</html>
