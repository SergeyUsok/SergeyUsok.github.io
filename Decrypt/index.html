	<body>
		<table>
        <tr>
          <td>Shared Secret:</td>
          <td><input type='password' name='sharedSecret' id='sharedSecret'></td>
        </tr>
         <tr>
          <td>Encrypted password:</td>
          <td><input type='text' name='password' id='password'></td>
        </tr>
        <tr>
          <td><input type="button" value="Decrypt" name="decrypt" id="decrypt" onclick="decrypt()"/></td>
		  <td><input type="button" value="Copy" name="copy" id="copy" onclick="copyPassword()"/></td>
        </tr>
        <tr>
          <td><span id='errorMsg'></span></td>
          <td><span id='result'></span></td>
        </tr>
      </table>
      
	</body>

  <script>
    function submitForm() {
      document.getElementById('errorMsg').innerHTML = '';
      try {
         let sharedsecret = document.getElementById('sharedSecret').value;
         let passwordInBase64 = document.getElementById('password').value;

		 console.log(decoded);
         let decryptedPassword = decrypt(sharedsecret, password);
		 
         document.getElementById('result').textContent = decryptedPassword;
        
      } catch(e) {
         document.getElementById('errorMsg').textContent = e.message;
      }
    }

    function decrypt(sharedSecret, encryptedString) {
      const decryptedBytes = CryptoJS.AES.decrypt(encryptedString, sharedSecret);
      const decryptedText = decryptedBytes.toString(CryptoJS.enc.Utf8);
      
      if (!decryptedText) {
        throw new Error("Failed to decrypt");
      }
      
      return decryptedText;
    }

	function b64DecodeUnicode(str) {
      // Going backwards: from bytestream, to percent-encoding, to original string.
      return decodeURIComponent(
        atob(str)
          .split("")
          .map(function (c) {
            return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
          })
          .join(""),
      );
    }

	function copyPassword() {
	    let copyText = document.getElementById("result");
	    let textArea = document.createElement("textarea");
	    textArea.value = copyText.textContent;
	    document.body.appendChild(textArea);
	    textArea.select();
	    document.execCommand("Copy");
	    textArea.remove();
	}
  </script>
</html>
