<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>JavaScript and TypeScript apps</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.4/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.4/css/bootstrap-theme.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.4/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="center-block">
            <div class="jumbotron">
                <div class="page-header">
                  <h2>Choose app to run</h2>
                </div>
                <div class="row">
                  <div class="col-xs-6 col-md-3">
                    <a href="/Minesweeper" class="thumbnail">
                      <img src="/Minesweeper/img/Minesweeper.png" 
                           alt="Minesweeper Icon"
                           title="Standard Minesweeper game">
                    </a>
                  </div>
                  <div class="col-xs-6 col-md-3">
                    <a href="/GameOfLife" class="thumbnail">
                      <img src="/GameOfLife/img/GameOfLife.png" 
                           alt="Game Of Life Icon"
                           title="Conway's Game Of Life">
                    </a>
                  </div>
                  <div class="col-xs-6 col-md-3">
                    <a href="/MetroMapBuilder" class="thumbnail">
                      <img src="/MetroMapBuilder/img/MetroMapBuilder.png" 
                           alt="Metro map builder application"
                           title="Metro map builder app">
                    </a>
                  </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
